name: Backend Continuous Integration & Regression Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Backend Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      APP_ENV: "testing"
      JWT_SECRET: "ci_github_workflow_secret_key_at_least_32_bytes!"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      DATABASE_URL: "sqlite:///:memory:"
      MONGODB_URI: ""
      MONGODB_DATABASE: "smart_health_test"
      PYTHONPATH: ".:packages"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Verification Suite (Unit, Integration, E2E)
        run: |
          python -m pytest tests/ -v --durations=10
